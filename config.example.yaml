# ====================================================================
# LAPTOP SMART SECURITY CAMERA CONFIGURATION (MẪU)
# ====================================================================

camera:
  source: 0                    # 0: webcam laptop mặc định (hoặc đường dẫn RTSP/video)
  width: 640                   # Chiều rộng khung hình
  height: 480                  # Chiều cao khung hình
  fps: 20                      # Số khung hình trên giây

detection:
  enabled: true
  model: "yolov8n.pt"          # Model YOLOv8 siêu nhẹ (nano)
  target_classes:
    - "person"                 # Chỉ cảnh báo khi phát hiện người (tránh báo động giả)
  confidence_threshold: 0.50   # Ngưỡng tin cậy của AI (0.0 - 1.0)
  motion_prefilter: true       # Bật lọc chuyển động nhanh trước khi gọi AI để tiết kiệm CPU/pin
  motion_threshold: 25         # Ngưỡng nhạy chuyển động pixel
  min_motion_area: 800         # Diện tích chuyển động tối thiểu (pixel vuông)
  cooldown_seconds: 30         # Khoảng nghỉ tối thiểu giữa các lần gửi cảnh báo Telegram

recording:
  save_dir: "recordings"       # Thư mục lưu trữ video sự kiện
  record_on_detect_seconds: 8  # Độ dài ghi hình sau khi phát hiện (giây)
  pre_buffer_seconds: 3        # Số giây lưu trữ trước khi phát hiện (ring buffer đón đầu)
  codec: "mp4v"                # Codec ghi hình ("mp4v" tương thích cao trên Windows)

retention:
  enabled: true                # Bật tính năng tự động dọn dẹp ổ đĩa
  max_days: 7                  # Tự động xoá các video/ảnh cũ hơn X ngày
  max_storage_gb: 10.0         # Tối đa dung lượng thư mục (GB), vượt quá sẽ xoá các file cũ nhất
  check_interval_minutes: 30   # Chu kỳ kiểm tra dọn dẹp (phút)

telegram:
  enabled: true
  bot_token: ""                # Điền Bot Token từ @BotFather hoặc dùng setup_telegram.py
  chat_id: ""                  # Điền Chat ID của bạn hoặc dùng setup_telegram.py
  send_snapshot: true          # Gửi ảnh chụp tức thì
  send_video: true             # Gửi clip video ngắn
  alert_title: "🚨 *CẢNH BÁO AN NINH: PHÁT HIỆN NGƯỜI!*"
  enable_commands: true        # Bật nhận lệnh điều khiển từ xa (/snapshot, /status, /help)

web_stream:
  enabled: true
  port: 8080
  enable_tunnel: true           # Tự động mở link Cloudflare HTTPS để xem trực tiếp từ xa (4G)
