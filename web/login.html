<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f14">
<title>Đăng nhập · Camera Laptop</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<form class="login-card" id="loginForm">
  <div class="login-logo">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.55-2.28A1 1 0 0121 8.62v6.76a1 1 0 01-1.45.9L15 14"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
  </div>
  <h1>Camera An Ninh Laptop</h1>
  <p class="muted">Nhập mật khẩu hoặc khoá truy cập (xem trong log khởi động / tin nhắn Telegram).</p>
  <input type="password" id="pw" placeholder="Mật khẩu / khoá truy cập" autocomplete="current-password" autofocus required>
  <button type="submit" class="btn primary block" id="loginBtn">Đăng nhập</button>
  <p class="login-err" id="err"></p>
</form>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: document.getElementById('pw').value})});
    const d = await r.json();
    if (d.ok) location.reload(); else err.textContent = d.error || 'Đăng nhập thất bại';
  } catch (_) { err.textContent = 'Không kết nối được tới camera'; }
  btn.disabled = false;
});
</script>
</body>
</html>
